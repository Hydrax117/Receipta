name: Contract Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "contract/**"
  workflow_dispatch:
    inputs:
      network:
        description: "Stellar network to deploy to"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  build-and-deploy-contract:
    name: Build & Deploy Soroban Contract
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.network || 'testnet' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: cargo-${{ hashFiles('contract/Cargo.lock') }}
          restore-keys: cargo-

      - name: Build contract (release)
        run: cargo build --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --version 22.0.1 --features opt

      - name: Configure Stellar network
        run: |
          NETWORK="${{ github.event.inputs.network || 'testnet' }}"
          if [ "$NETWORK" = "testnet" ]; then
            stellar network add \
              --rpc-url https://soroban-testnet.stellar.org \
              --network-passphrase "Test SDF Network ; September 2015" \
              testnet
          else
            stellar network add \
              --rpc-url ${{ secrets.STELLAR_RPC_URL }} \
              --network-passphrase "Public Global Stellar Network ; September 2015" \
              mainnet
          fi

      - name: Import deployer identity
        run: |
          echo "${{ secrets.STELLAR_DEPLOY_SECRET_KEY }}" | \
            stellar keys add deployer --secret-key

      - name: Deploy contract
        id: deploy
        run: |
          NETWORK="${{ github.event.inputs.network || 'testnet' }}"
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contract/target/wasm32-unknown-unknown/release/receipta_contract.wasm \
            --source deployer \
            --network "$NETWORK")
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed contract ID: $CONTRACT_ID"

      - name: Upload contract WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: receipta-contract-wasm-${{ github.sha }}
          path: contract/target/wasm32-unknown-unknown/release/receipta_contract.wasm
          retention-days: 30

      - name: Print deployment summary
        run: |
          echo "### Contract Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | ${{ github.event.inputs.network || 'testnet' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract ID | \`${{ steps.deploy.outputs.contract_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
